name: Test the action on a pull request

# Runs the action from this checkout as a pull request would, and checks what it posts:
# its comment, its exit code and its verdict, and the diagram it embeds. Each job deletes
# its comment afterwards. Jobs run on pull requests that are ready for review and not from
# a fork, whose token cannot comment or push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # embed-image commits the diagram to a branch
  pull-requests: write # the action comments

jobs:
  holds:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: run
        uses: ./
        continue-on-error: true
        with:
          working-directory: tests/action/release
          justification: justification.json
          library: steps.py

      - uses: ./.github/actions/check-result
        with:
          result: ${{ steps.run.outputs.result }}
          expected: "0"
          verdict: ${{ steps.run.outputs.verdict }}
          expected-verdict: pass

      - id: comment
        uses: ./.github/actions/fetch-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

      - name: The comment says the justification holds
        env:
          BODY: ${{ steps.comment.outputs.body }}
        run: |
          grep -qF 'holds (exit code 0)' <<< "$BODY"

      - if: always()
        uses: ./.github/actions/delete-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

  embed-image:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: run
        uses: ./
        continue-on-error: true
        with:
          working-directory: tests/action/release
          justification: justification.json
          library: steps.py
          embed-image: "true"

      - uses: ./.github/actions/check-result
        with:
          result: ${{ steps.run.outputs.result }}
          expected: "0"

      - id: comment
        uses: ./.github/actions/fetch-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

      - name: The image in the comment is the diagram, byte for byte
        env:
          BODY: ${{ steps.comment.outputs.body }}
          DIAGRAM: ${{ steps.run.outputs.diagram }}
        run: |
          url="$(sed -n 's/.*!\[The justification, with the run over it\](\([^)]*\)).*/\1/p' <<< "$BODY" | head -n 1)"
          if [[ -z "$url" ]]; then
            echo "::error::the comment embeds no diagram"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/embedded" "$url"
          embedded="$(sha256sum "$RUNNER_TEMP/embedded" | cut -d' ' -f1)"
          drawn="$(sha256sum "$DIAGRAM" | cut -d' ' -f1)"
          echo "embedded $embedded, drawn $drawn"
          [[ "$embedded" == "$drawn" ]]

      - if: always()
        uses: ./.github/actions/delete-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

  a-step-raises:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: run
        uses: ./
        continue-on-error: true
        with:
          working-directory: tests/action/raised
          justification: justification.json
          library: steps.py

      - uses: ./.github/actions/check-result
        with:
          result: ${{ steps.run.outputs.result }}
          expected: "1"
          verdict: ${{ steps.run.outputs.verdict }}
          expected-verdict: fail

      - id: comment
        uses: ./.github/actions/fetch-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

      - name: The comment shows the exception
        env:
          BODY: ${{ steps.comment.outputs.body }}
        run: |
          grep -qF 'JP022' <<< "$BODY"
          grep -qF 'This is an intentional exception raised by the test' <<< "$BODY"

      - if: always()
        uses: ./.github/actions/delete-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

  a-library-cannot-be-imported:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: run
        uses: ./
        continue-on-error: true
        with:
          working-directory: tests/action/import_error
          justification: justification.json
          library: steps.py

      - uses: ./.github/actions/check-result
        with:
          result: ${{ steps.run.outputs.result }}
          expected: "3"
          verdict: ${{ steps.run.outputs.verdict }}
          expected-verdict: invalid

      - id: comment
        uses: ./.github/actions/fetch-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

      - name: The comment shows the exception raised on import
        env:
          BODY: ${{ steps.comment.outputs.body }}
        run: |
          grep -qF 'JP020' <<< "$BODY"
          grep -qF 'This is an intentional exception raised during import' <<< "$BODY"

      - if: always()
        uses: ./.github/actions/delete-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

  python-executable:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: run
        uses: ./
        continue-on-error: true
        with:
          working-directory: tests/action/python_version
          justification: justification.json
          library: steps.py
          python-executable: ${{ steps.python.outputs.python-path }}
          comment: "false"

      # The steps pass only on Python 3.12, the interpreter given.
      - uses: ./.github/actions/check-result
        with:
          result: ${{ steps.run.outputs.result }}
          expected: "0"
          verdict: ${{ steps.run.outputs.verdict }}
          expected-verdict: pass

  dry-run:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # embed-image on purpose: a dry run draws the argument, and the action must embed
      # it, or cope without a diagram, without failing.
      - id: run
        uses: ./
        continue-on-error: true
        with:
          working-directory: tests/action/release
          justification: justification.json
          library: steps.py
          dry-run: "true"
          embed-image: "true"

      - uses: ./.github/actions/check-result
        with:
          result: ${{ steps.run.outputs.result }}
          expected: "0"
          verdict: ${{ steps.run.outputs.verdict }}
          expected-verdict: valid

      - name: The action's own steps succeeded
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: '[[ "$OUTCOME" == "success" ]]'

      - id: comment
        uses: ./.github/actions/fetch-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}

      - name: The comment announces a dry run
        env:
          BODY: ${{ steps.comment.outputs.body }}
        run: |
          grep -qF 'is valid: a dry run, no step was called' <<< "$BODY"

      - if: always()
        uses: ./.github/actions/delete-comment
        with:
          comment-id: ${{ steps.run.outputs.comment-id }}
          github-token: ${{ github.token }}
