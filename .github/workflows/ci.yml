name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflows and action metadata
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the action from this checkout
        uses: ./
